# Зачем: задание требует, чтобы каждый push сам выкладывал живое демо, без ручной публикации.
# Что делает: собирает Wasm и Angular и публикует каталог браузера на GitHub Pages.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - run: npm ci
      - run: npm run build -- --base-href /findev-test-cursor/

      - name: Keep direct links to Dashboard and Settings
        run: cp dist/findev-test-cursor/browser/index.html dist/findev-test-cursor/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/findev-test-cursor/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
